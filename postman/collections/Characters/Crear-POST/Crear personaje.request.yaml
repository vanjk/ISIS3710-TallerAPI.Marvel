$kind: http-request
url: "{{baseUrl}}/characters"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "real_name": "Matt Murdock",
      "alias": "Daredevil",
      "main_power": "Radar sense",
      "power_level": 65
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 201", function () { pm.response.to.have.status(201); });
      pm.test("Guarda el id creado", function () { pm.collectionVariables.set("characterId", pm.response.json().id); });
    language: text/javascript
settings: {}
order: 1000
