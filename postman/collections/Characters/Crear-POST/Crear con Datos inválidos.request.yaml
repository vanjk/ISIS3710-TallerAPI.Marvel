$kind: http-request
url: "{{baseUrl}}/characters"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "real_name": "Test",
      "alias": "Nuevo",
      "main_power": "Nada",
      "power_level": 150,
      "status": "DEAD"
    }
scripts:
  - type: afterResponse
    code: pm.test("Responde 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
settings: {}
order: 3000
