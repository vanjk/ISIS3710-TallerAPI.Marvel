$kind: http-request
url: "{{baseUrl}}/characters"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "real_name": "Bucky Barnes",
      "alias": "Winter Soldier",
      "main_power": "Bionic arm",
      "power_level": 70,
      "team_id": 99
    }
scripts:
  - type: afterResponse
    code: pm.test("Responde 404", function () { pm.response.to.have.status(404); });
    language: text/javascript
settings: {}
order: 5000
