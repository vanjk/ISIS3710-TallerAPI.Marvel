$kind: http-request
url: "{{baseUrl}}/characters/{{characterId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "alias": "Solo alias"
    }
scripts:
  - type: afterResponse
    code: pm.test("Responde 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
settings: {}
order: 2000
