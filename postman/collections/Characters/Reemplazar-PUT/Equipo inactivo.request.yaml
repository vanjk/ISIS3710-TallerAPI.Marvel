$kind: http-request
url: "{{baseUrl}}/characters/{{characterId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "real_name": "Matt Murdock",
      "alias": "Daredevil",
      "main_power": "Radar sense",
      "power_level": 65,
      "team_id": 6
    }
scripts:
  - type: afterResponse
    code: pm.test("Responde 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
settings: {}
order: 4000
