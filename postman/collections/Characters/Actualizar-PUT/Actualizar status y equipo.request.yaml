$kind: http-request
url: "{{baseUrl}}/characters/{{characterId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "INJURED",
      "team_id": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", function () { pm.response.to.have.status(200); });
      pm.test("Quedó en Avengers", function () { pm.expect(pm.response.json().team.id).to.eql(1); });
    language: text/javascript
settings: {}
order: 1000
