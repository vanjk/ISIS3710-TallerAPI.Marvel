$kind: http-request
name: Status inválido -> 400
url: "{{baseUrl}}/characters/{{characterId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "DEAD"
    }
scripts:
  - type: afterResponse
    code: pm.test("Responde 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
settings: {}
order: 5000
