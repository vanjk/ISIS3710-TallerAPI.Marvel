$kind: http-request
url: "{{baseUrl}}/characters/{{characterId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "INJURED"
    }
scripts:
  - type: afterResponse
    code: pm.test("Responde 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
settings: {}
order: 4000
