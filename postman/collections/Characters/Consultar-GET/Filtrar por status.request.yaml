$kind: http-request
url: "{{baseUrl}}/characters?status=MISSING"
method: GET
queryParams:
  status: MISSING
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", function () { pm.response.to.have.status(200); });
      pm.test("Todos están MISSING", function () { pm.response.json().forEach(c => pm.expect(c.status).to.eql("MISSING")); });
    language: text/javascript
settings: {}
order: 3000
